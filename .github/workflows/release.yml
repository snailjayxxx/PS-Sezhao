name: Test, build and release all editions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ps-sezhao-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements.txt
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Verify RAW runtime
        run: |
          PYTHONPATH=standalone python - <<'PY'
          import rawpy
          from ps_sezhao.color_profiles import validate_profiles
          validate_profiles()
          print('rawpy', rawpy.__version__, 'LibRaw', rawpy.libraw_version)
          PY
      - name: Validate Photoshop plug-in
        run: node scripts/validate.mjs
      - name: Run Photoshop engine and UI tests
        run: node --test tests/*.test.js
      - name: Run standalone engine and RAW tests
        run: PYTHONPATH=standalone python -m unittest discover -s standalone/tests -v
      - name: Validate Lightroom Lua syntax
        run: luac5.4 -p lightroom-classic/PS-Sezhao.lrplugin/*.lua
      - name: Test Lightroom native develop profiles
        run: lua5.4 lightroom-classic/tests/native_profiles_test.lua lightroom-classic/PS-Sezhao.lrplugin/NativeProfiles.lua

  build-common:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify Photoshop, developer and source packages
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: common-release-assets
          path: dist/*

  build-macos:
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements-build.txt
      - name: Build Apple Silicon standalone app and Lightroom package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          pyinstaller --noconfirm --clean --windowed \
            --name PS-Sezhao \
            --paths standalone \
            --additional-hooks-dir=. \
            --collect-all rawpy \
            --collect-all tkinterdnd2 \
            standalone/main.py
          mkdir -p release-assets lr-stage/PS-Sezhao.lrplugin/bin/macos-arm64
          cp -R lightroom-classic/PS-Sezhao.lrplugin/. lr-stage/PS-Sezhao.lrplugin/
          cp -R dist/PS-Sezhao.app lr-stage/PS-Sezhao.lrplugin/bin/macos-arm64/
          ditto -c -k --sequesterRsrc --keepParent dist/PS-Sezhao.app \
            "release-assets/PS-Sezhao-Standalone-macOS-arm64-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent lr-stage/PS-Sezhao.lrplugin \
            "release-assets/PS-Sezhao-LightroomClassic-macOS-arm64-v${VERSION}.zip"
      - name: Start packaged macOS GUI and verify drag-drop runtime
        run: |
          dist/PS-Sezhao.app/Contents/MacOS/PS-Sezhao --gui-smoke-test --require-dnd
          if ! find dist/PS-Sezhao.app -iname '*tkdnd*' -print -quit | grep -q .; then
            echo 'The macOS app does not contain the TkDND runtime.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: release-assets/*

  build-windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements-build.txt
      - name: Build Windows standalone app and Lightroom package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name PS-Sezhao `
            --paths standalone `
            --additional-hooks-dir=. `
            --collect-all rawpy `
            --collect-all tkinterdnd2 `
            standalone/main.py
          New-Item -ItemType Directory -Force release-assets | Out-Null
          New-Item -ItemType Directory -Force lr-stage/PS-Sezhao.lrplugin/bin/windows-x64 | Out-Null
          Copy-Item lightroom-classic/PS-Sezhao.lrplugin/* lr-stage/PS-Sezhao.lrplugin/ -Recurse -Force
          Copy-Item dist/PS-Sezhao.exe lr-stage/PS-Sezhao.lrplugin/bin/windows-x64/PS-Sezhao.exe -Force
          Compress-Archive -Path dist/PS-Sezhao.exe -DestinationPath "release-assets/PS-Sezhao-Standalone-Windows-x64-v$version.zip" -Force
          Compress-Archive -Path lr-stage/PS-Sezhao.lrplugin -DestinationPath "release-assets/PS-Sezhao-LightroomClassic-Windows-x64-v$version.zip" -Force
      - name: Verify packaged RAW, drag-drop and real GUI startup
        shell: pwsh
        run: |
          $listing = (& pyi-archive_viewer -l dist/PS-Sezhao.exe | Out-String)
          if ($listing -notmatch 'rawpy') {
            throw 'The Windows executable archive does not contain rawpy.'
          }
          if ($listing -notmatch '_rawpy') {
            throw 'The Windows executable archive does not contain the compiled rawpy extension.'
          }
          if ($listing -notmatch 'tkinterdnd2') {
            throw 'The Windows executable archive does not contain tkinterdnd2.'
          }
          if ($listing -notmatch 'tkdnd') {
            throw 'The Windows executable archive does not contain the TkDND runtime.'
          }
          $process = Start-Process -FilePath "dist/PS-Sezhao.exe" -ArgumentList "--gui-smoke-test", "--require-dnd" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows GUI smoke test failed with exit code $($process.ExitCode)."
          }
          Write-Host 'Windows archive and packaged GUI validation succeeded.'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*

  release:
    if: github.event_name != 'pull_request'
    needs: [build-common, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > CHECKSUMS.txt
          ls -lh
      - name: Create or refresh GitHub Release for VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" \
              --title "PS-Sezhao $TAG" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "PS-Sezhao $TAG" \
              --notes-file RELEASE_NOTES.md
          fi

  report:
    if: always() && github.event_name != 'pull_request'
    needs: [validate, build-common, build-macos, build-windows, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report or clear build failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          COMMON_RESULT: ${{ needs.build-common.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TITLE="PS-Sezhao v${VERSION} 自动构建失败"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ "$RELEASE_RESULT" = "success" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --comment "v${VERSION} 已成功构建并发布，本问题自动关闭。"
            fi
            exit 0
          fi
          BODY=$(cat <<EOF
          自动构建未完成。

          - Run ID: $GITHUB_RUN_ID
          - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - validate: $VALIDATE_RESULT
          - build-common: $COMMON_RESULT
          - build-macos: $MACOS_RESULT
          - build-windows: $WINDOWS_RESULT
          - release: $RELEASE_RESULT
          - commit: $GITHUB_SHA
          EOF
          )
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
