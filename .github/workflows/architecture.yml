name: Validate standalone architecture

on:
  push:
    branches:
      - refactor/v0.7-architecture
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps-sezhao-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and virtual display
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements.txt
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Run standalone tests with a real Tk display
        run: xvfb-run -a env PYTHONPATH=standalone python -m unittest discover -s standalone/tests -v
      - name: Verify source entrypoint
        run: PYTHONPATH=standalone python standalone/main.py --help
