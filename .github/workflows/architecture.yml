name: Validate standalone architecture

on:
  push:
    branches:
      - refactor/v0.7-architecture
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps-sezhao-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and virtual display
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements.txt
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Run standalone tests with a real Tk display
        run: xvfb-run -a env PYTHONPATH=standalone python -m unittest discover -s standalone/tests -v
      - name: Verify source entrypoint
        run: PYTHONPATH=standalone python standalone/main.py --help
      - name: Verify source GUI can start with optional drag-drop
        run: xvfb-run -a env PYTHONPATH=standalone python standalone/main.py --gui-smoke-test

  packaged-macos:
    needs: standalone
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements-build.txt
      - name: Build and start packaged macOS window
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name PS-Sezhao \
            --paths standalone \
            --additional-hooks-dir=. \
            --collect-all rawpy \
            --collect-all tkinterdnd2 \
            standalone/main.py
          dist/PS-Sezhao.app/Contents/MacOS/PS-Sezhao --gui-smoke-test --require-dnd

  packaged-windows:
    needs: standalone
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r standalone/requirements-build.txt
      - name: Build and start packaged Windows window
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name PS-Sezhao `
            --paths standalone `
            --additional-hooks-dir=. `
            --collect-all rawpy `
            --collect-all tkinterdnd2 `
            standalone/main.py
          $process = Start-Process -FilePath "dist/PS-Sezhao.exe" -ArgumentList "--gui-smoke-test", "--require-dnd" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows GUI smoke test failed with exit code $($process.ExitCode)."
          }
