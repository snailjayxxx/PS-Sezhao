name: Unblock v0.7.2 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unblock-v0.7.2-release.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stuck-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck v0.7.2 release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 31118372344 --repo "$GITHUB_REPOSITORY" || true
          echo "Cancelled stuck release run 31118372344."
